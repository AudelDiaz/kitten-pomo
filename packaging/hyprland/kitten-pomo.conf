# Pixel Kitten Pomodoro — ejemplo para Hyprland (NO probado, se aceptan PRs con screenshot).
# Añade estas líneas a tu hyprland.conf con `source =`.
windowrulev2 = float, class:^(kitten-pomo)$
windowrulev2 = size 200 200, class:^(kitten-pomo)$
windowrulev2 = move 100%-216 100%-216, class:^(kitten-pomo)$
windowrulev2 = pin, class:^(kitten-pomo)$
windowrulev2 = opacity 0.8, class:^(kitten-pomo)$
windowrulev2 = noinitialfocus, class:^(kitten-pomo)$
